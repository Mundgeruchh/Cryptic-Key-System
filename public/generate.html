<!doctype html>
<html lang="en">
<head>
<script src="https://quge5.com/88/tag.min.js" data-zone="282442" async data-cfasync="false"></script>
<script>(function(s){s.dataset.zone='11830440',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryptic Key System</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main class="wrap">
  <div class="logo">Cryptic <span>Key System</span></div>
  <div class="subtitle">Verify you're human, complete a few quick tasks, and get your key.</div>

  <div class="steps">
    <div class="step-dot" id="dot-0"></div>
    <div class="step-dot" id="dot-1"></div>
    <div class="step-dot" id="dot-2"></div>
    <div class="step-dot" id="dot-3"></div>
  </div>

  <div class="card" id="stage-verify">
    <h2>1. Human Verification</h2>
    <div id="turnstile-container" style="margin-bottom:16px;"></div>
    <div class="error" id="verify-error"></div>
  </div>

  <div class="card" id="stage-ads" style="display:none;">
    <h2 id="ad-title">2. Complete the task</h2>
    <div class="ad-slot" id="ad-slot">
      An ad has opened in a new tab. Solve the task below while you wait.
    </div>
    <button id="ad-continue-btn" disabled>Complete the task above</button>
    <div class="error" id="ad-error"></div>
  </div>

  <div class="card" id="stage-key" style="display:none;">
    <h2>🎉 Your Key</h2>
    <div class="key-box" id="key-value">...</div>
    <button id="copy-btn">Copy key</button>
    <div class="success-text" id="copy-msg" style="margin-top:10px;"></div>
  </div>

  <div class="footer">Cryptic Key System</div>
</main>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="/js/main.js"></script>
</body>
</html>
