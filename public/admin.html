<!doctype html>
<html lang="en">
<head>
<script src="https://quge5.com/88/tag.min.js" data-zone="282442" async data-cfasync="false"></script>
<script>(function(s){s.dataset.zone='11830440',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Cryptic Key System</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="wrap wrap-wide">
  <div class="logo">Cryptic <span>Admin</span></div>

  <div class="card" id="login-card">
    <h2>Admin Login</h2>
    <input type="password" id="pass" placeholder="Admin password">
    <button id="login-btn">Log in</button>
    <div class="error" id="login-error"></div>
  </div>

  <div id="panel" style="display:none;">

    <div class="card">
      <h2>Stats</h2>
      <div class="stats-grid">
        <div class="stat"><div class="num" id="stat-available">-</div><div class="label">Available</div></div>
        <div class="stat"><div class="num" id="stat-used">-</div><div class="label">Used</div></div>
        <div class="stat"><div class="num" id="stat-total">-</div><div class="label">Total ever</div></div>
      </div>
      <button id="refresh-btn" class="btn-secondary">Refresh</button>
    </div>

    <div class="card">
      <h2>Add new keys</h2>
      <p class="muted" style="margin-top:-8px;margin-bottom:14px;">One key per line, .txt file.</p>

      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📄</div>
        <div class="dropzone-text">Drag &amp; drop your .txt file here</div>
        <div class="dropzone-sub">or click to browse</div>
        <input type="file" id="file-input" accept=".txt" hidden>
      </div>

      <div class="selected-file" id="selected-file" style="display:none;">
        <span id="selected-file-name"></span>
        <button class="btn-tiny" id="clear-file-btn">✕</button>
      </div>

      <button id="upload-btn" class="btn-upload" disabled>Upload keys</button>
      <div class="error" id="upload-error"></div>
      <div class="success-text" id="upload-success"></div>
    </div>

    <div class="card">
      <h2>All keys</h2>
      <div class="key-filter">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="available">Available</button>
        <button class="filter-btn" data-filter="used">Used</button>
      </div>
      <div class="key-list" id="key-list">
        <div class="muted" style="padding:12px 0;">Loading...</div>
      </div>
    </div>

  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
